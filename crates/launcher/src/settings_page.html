<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" type="image/x-icon" />
<title>Sim RaceCenter — Director Console Settings</title>
<style>
  :root {
    --apex: #FF5F1F;
    --telemetry: #0EA5E9;
    --bg: #05070A;
    --surface: #111827;
    --text: #E5E7EB;
    --muted: #9CA3AF;
  }
  body {
    margin: 0;
    font-family: Roboto, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .container {
    width: 420px;
    max-width: 90%;
    background: var(--surface);
    border-radius: 8px;
    padding: 24px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, .5);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.25rem;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .subtitle {
    color: var(--muted);
    font-size: .875rem;
    margin-bottom: 24px;
  }
  .options {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }
  .option {
    flex: 1;
    background: var(--bg);
    border: 2px solid #1F2937;
    border-radius: 6px;
    padding: 16px;
    cursor: pointer;
    text-align: center;
    transition: border-color .15s;
  }
  .option:hover {
    border-color: var(--apex);
  }
  .option.active {
    border-color: var(--apex);
  }
  .option h3 {
    margin: 0 0 4px;
    font-size: 1rem;
  }
  .option p {
    margin: 0;
    color: var(--muted);
    font-size: .75rem;
  }
  .status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: .875rem;
    color: var(--muted);
  }
  .status-value {
    color: var(--text);
    font-weight: 500;
  }
  .status-value.connected {
    color: var(--telemetry);
  }
  .status-value.not-running {
    color: var(--muted);
  }
  .pairing {
    display: none;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #1F2937;
  }
  .pairing.active {
    display: block;
  }
  .pairing h2 {
    margin: 0 0 12px;
    font-size: .95rem;
  }
  .pairing-value {
    margin: 8px 0;
    color: var(--text);
    word-break: break-all;
  }
  .pairing-label {
    margin-top: 10px;
    color: var(--muted);
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  #pairing-code {
    font: 700 1.8rem ui-monospace, SFMono-Regular, monospace;
    letter-spacing: .12em;
  }
  .pairing button {
    border: 0;
    border-radius: 4px;
    padding: 8px 12px;
    color: var(--text);
    background: var(--apex);
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Director Console</h1>
  <div class="subtitle">Select active simulator telemetry source</div>
  <div class="options" role="group" aria-label="Active simulator">
    <div class="option" id="opt-iracing" data-testid="select-iracing" role="button" aria-pressed="false" tabindex="0">
      <h3>iRacing</h3>
      <p>iRacing telemetry</p>
    </div>
    <div class="option" id="opt-lmu" data-testid="select-lmu" role="button" aria-pressed="false" tabindex="0">
      <h3>LMU</h3>
      <p>Le Mans Ultimate</p>
    </div>
    <div class="option" id="opt-publisher" data-testid="select-publisher" role="button" aria-pressed="false" tabindex="0">
      <h3>Publisher</h3>
      <p>Telemetry publisher for Director-managed Rigs</p>
    </div>
  </div>
  <div class="status">
    <span>Active source</span>
    <span class="status-value" data-testid="active-sim" id="active-sim">—</span>
  </div>
  <div class="status" style="margin-top: 8px;">
    <span>Connection status</span>
    <span class="status-value" data-testid="connection-status" id="connection-status">—</span>
  </div>
  <div class="pairing" id="rig-pairing">
    <h2>RIG PAIRING</h2>
    <div class="pairing-label">Pairing code</div>
    <div class="pairing-value" id="pairing-code" data-testid="pairing-code">—</div>
    <div class="pairing-label">Certificate fingerprint</div>
    <div class="pairing-value" id="cert-fingerprint" data-testid="cert-fingerprint">—</div>
    <div class="pairing-value" id="pairing-status" data-testid="pairing-status">Not paired</div>
    <button id="unpair" data-testid="unpair" type="button">UNPAIR</button>
  </div>
</div>
<script>
const optIracing = document.getElementById('opt-iracing');
const optLmu = document.getElementById('opt-lmu');
const optPublisher = document.getElementById('opt-publisher');
const activeEl = document.getElementById('active-sim');
const statusEl = document.getElementById('connection-status');
const pairingEl = document.getElementById('rig-pairing');
const pairingCodeEl = document.getElementById('pairing-code');
const fingerprintEl = document.getElementById('cert-fingerprint');
const pairingStatusEl = document.getElementById('pairing-status');
const unpairEl = document.getElementById('unpair');

function setActive(sim, connected, toolNames) {
  const simName = sim === 'lmu' ? 'LMU' : (sim === 'publisher' ? 'Publisher' : 'iRacing');
  activeEl.textContent = simName;
  statusEl.textContent = connected ? 'Connected' : 'Not Running';
  statusEl.className = 'status-value ' + (connected ? 'connected' : 'not-running');
  optIracing.classList.toggle('active', sim === 'iracing');
  optIracing.setAttribute('aria-pressed', sim === 'iracing');
  optLmu.classList.toggle('active', sim === 'lmu');
  optLmu.setAttribute('aria-pressed', sim === 'lmu');
  optPublisher.classList.toggle('active', sim === 'publisher');
  optPublisher.setAttribute('aria-pressed', sim === 'publisher');
  pairingEl.classList.toggle('active', sim === 'publisher');
  console.log('Telemetry source:', simName, 'Tools:', (toolNames || []).length);
}

function setPairing(data) {
  pairingCodeEl.textContent = data.pairingCode || '—';
  fingerprintEl.textContent = data.certFingerprint || '—';
  pairingStatusEl.textContent = data.paired ? ('Paired with ' + (data.directorName || 'Director Console')) : 'Not paired';
}

async function loadStatus() {
  const res = await fetch('/api/status');
  const data = await res.json();
  setActive(data.sim, data.connected, data.toolNames);
  setPairing(data);
}

async function selectSim(sim) {
  const res = await fetch('/api/sim', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sim })
  });
  const data = await res.json();
  setActive(data.sim, data.connected, data.toolNames);
  setPairing(data);
}

async function unpair() {
  const res = await fetch('/api/unpair', { method: 'POST' });
  setPairing(await res.json());
}

optIracing.addEventListener('click', () => selectSim('iracing'));
optLmu.addEventListener('click', () => selectSim('lmu'));
optPublisher.addEventListener('click', () => selectSim('publisher'));
optIracing.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') selectSim('iracing'); });
optLmu.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') selectSim('lmu'); });
optPublisher.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') selectSim('publisher'); });
unpairEl.addEventListener('click', unpair);

loadStatus();
setInterval(loadStatus, 5000);
</script>
</body>
</html>
